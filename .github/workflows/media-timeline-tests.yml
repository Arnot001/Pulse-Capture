name: Media timeline Phase A

on:
  push:
    branches:
      - feature/media-timeline-phase-a-20261124
  pull_request:
    paths:
      - 'editor/**'
      - 'tests/**'
      - '.github/workflows/media-timeline-tests.yml'
  workflow_dispatch:

jobs:
  windows-regressions:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks
        shell: pwsh
        run: |
          python -m py_compile editor/imported_media.py editor/imported_media_ui.py editor/editor_window.py editor/reaction_preview.py editor/reactions.py editor/playback_preview.py editor/preview.py
      - name: Media timeline tests
        shell: pwsh
        run: python -m unittest tests.test_imported_media tests.test_imported_media_preview tests.test_timeline_drag -v
      - name: Install FFmpeg for real media render
        shell: pwsh
        run: |
          for ($attempt=1; $attempt -le 4; $attempt++) {
            choco install ffmpeg -y --no-progress
            if ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and
                (Get-Command ffprobe -ErrorAction SilentlyContinue)) { break }
            Write-Host "FFmpeg feed unavailable, retry $attempt/4"
            Start-Sleep -Seconds (3 * $attempt)
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            throw 'FFmpeg and FFprobe must be installed to verify a real export.'
          }
      - name: Real MP4 media render
        shell: pwsh
        run: python -m unittest tests.test_imported_media_render -v
      - name: Full regression suite
        shell: pwsh
        run: python -m unittest discover -q
