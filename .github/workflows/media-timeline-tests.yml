name: Media timeline Phase A

on:
  push:
    branches:
      - feature/media-timeline-phase-a-20261124
  pull_request:
    paths:
      - 'editor/**'
      - 'tests/**'
      - '.github/workflows/media-timeline-tests.yml'
  workflow_dispatch:

jobs:
  windows-regressions:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax checks
        shell: pwsh
        run: |
          python -m py_compile editor/imported_media.py editor/imported_media_ui.py editor/editor_window.py editor/reactions.py editor/playback_preview.py editor/preview.py
      - name: Media timeline tests
        shell: pwsh
        run: python -m unittest tests.test_imported_media tests.test_timeline_drag -v
      - name: Full regression suite
        shell: pwsh
        run: python -m unittest discover -q
